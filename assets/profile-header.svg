<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
  <title id="title">Levi Qiao — AI Systems Engineer</title>
  <desc id="desc">A dark gradient banner with a connected-node motif.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111827"/>
      <stop offset="0.52" stop-color="#28245a"/>
      <stop offset="1" stop-color="#0f766e"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#5eead4"/>
    </linearGradient>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="300" rx="24" fill="url(#bg)"/>
  <g opacity=".13" fill="none" stroke="#fff">
    <path d="M0 70h1200M0 150h1200M0 230h1200"/>
    <path d="M110 0v300M300 0v300M900 0v300M1090 0v300"/>
  </g>

  <g transform="translate(91 67)" fill="none" stroke="url(#accent)" stroke-width="3" opacity=".9">
    <path d="M45 82 105 35 166 67 108 132 45 82Z"/>
    <path d="M105 35 108 132M45 82l121-15"/>
    <circle cx="45" cy="82" r="9" fill="#a78bfa" filter="url(#glow)"/>
    <circle cx="105" cy="35" r="8" fill="#c4b5fd"/>
    <circle cx="166" cy="67" r="9" fill="#5eead4" filter="url(#glow)"/>
    <circle cx="108" cy="132" r="8" fill="#99f6e4"/>
  </g>

  <g transform="translate(960 85)" fill="none" stroke="url(#accent)" stroke-width="2.5" opacity=".72">
    <path d="M15 80 75 24 151 65 104 130 15 80Z"/>
    <path d="M75 24 104 130M15 80l136-15"/>
    <circle cx="15" cy="80" r="6" fill="#a78bfa"/>
    <circle cx="75" cy="24" r="6" fill="#c4b5fd"/>
    <circle cx="151" cy="65" r="6" fill="#5eead4"/>
    <circle cx="104" cy="130" r="6" fill="#99f6e4"/>
  </g>

  <g text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <text x="600" y="127" fill="#fff" font-size="48" font-weight="700" letter-spacing="2">LEVI QIAO</text>
    <rect x="453" y="153" width="294" height="2" rx="1" fill="url(#accent)"/>
    <text x="600" y="198" fill="#dbeafe" font-size="22" font-weight="500" letter-spacing="4">AI SYSTEMS ENGINEER</text>
    <text x="600" y="233" fill="#bfdbfe" font-size="15" letter-spacing="2">AGENTS · EVALUATION · RELIABILITY</text>
  </g>
</svg>
